# A one-off experiment, not part of publishing.
#
# Question: can a workflow running in THIS repo publish into
# majest/majest.github.io using nothing but the default GITHUB_TOKEN?
#
# It never writes anything. The write test is `git push --dry-run`, which
# authenticates and asks the server for permission but cannot update a ref.
# Delete this file once the answer has been recorded.

name: Cross-repo write probe

on:
  workflow_dispatch:

# The most this workflow's token can be granted. Note that `contents: write`
# means write to claude-adam - a token cannot be given rights to another repo.
permissions:
  contents: write

env:
  TARGET: majest/majest.github.io

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Where this token comes from
        run: |
          echo "workflow runs in : $GITHUB_REPOSITORY"
          echo "probing          : $TARGET"

      - name: Can the token READ the site repo?
        id: read
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git ls-remote "https://x-access-token:${TOKEN}@github.com/${TARGET}.git" HEAD >/dev/null 2>read.err
          if [ $? -eq 0 ]; then
            echo "verdict=yes" >> "$GITHUB_OUTPUT"
            echo "READ: allowed"
          else
            echo "verdict=no" >> "$GITHUB_OUTPUT"
            echo "READ: refused"
            sed -e 's/x-access-token:[^@]*@/x-access-token:***@/g' read.err
          fi
          exit 0

      - name: Can the token WRITE to the site repo?
        id: write
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${TARGET}.git" target 2>clone.err
          if [ $? -ne 0 ]; then
            echo "verdict=clone-failed" >> "$GITHUB_OUTPUT"
            sed -e 's/x-access-token:[^@]*@/x-access-token:***@/g' clone.err
            exit 0
          fi

          cd target
          git config user.name  "probe"
          git config user.email "probe@example.invalid"
          echo "probe" > .probe
          git add .probe
          git commit -q -m "probe (dry run only, never lands)"

          # --dry-run performs the auth and the permission check, but the
          # server is never asked to update a ref. Nothing can be modified.
          git push --dry-run origin "HEAD:refs/heads/ci-write-probe" 2>push.err
          if [ $? -eq 0 ]; then
            echo "verdict=yes" >> "$GITHUB_OUTPUT"
            echo "WRITE: allowed"
          else
            echo "verdict=no" >> "$GITHUB_OUTPUT"
            echo "WRITE: refused"
            sed -e 's/x-access-token:[^@]*@/x-access-token:***@/g' push.err | tee ../push.clean
          fi
          exit 0

      - name: Record the answer
        run: |
          {
            echo "## Can claude-adam publish into $TARGET with the default token?"
            echo
            echo "| | verdict |"
            echo "| --- | --- |"
            echo "| read  | ${{ steps.read.outputs.verdict }} |"
            echo "| write | ${{ steps.write.outputs.verdict }} |"
            echo
            if [ -f push.clean ]; then
              echo '```'
              cat push.clean
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
